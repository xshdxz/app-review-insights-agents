name: CI

on:
  # 全分支触发：原先只挂 main，导致功能分支上的提交从未在 Linux 上跑过一次，
  # "分支绿灯"只能靠本地自测——而本地与 CI 的调用方式并不完全等价（见 README 的测试章节）。
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff>=0.12,<1"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # --cov-fail-under 是地板不是目标：当前 93%，掉到 90 以下说明有新代码没被测到
      - name: Run tests
        run: pytest --cov=app_review_insights --cov-report=term-missing --cov-fail-under=90
      # 坏掉的评测集跑出来的数字毫无意义，所以它本身也要过门禁（不调用模型，零成本）
      - name: Validate gold evaluation dataset
        run: python scripts/run_eval.py
      # 检索评测：查询集校验 + 离线基线门禁（纯 FTS，不调用模型，零成本）
      - name: Validate retrieval eval dataset
        run: python scripts/run_retrieval_eval.py --validate-only
      - name: Retrieval baseline gate
        run: python scripts/run_retrieval_eval.py --fail-under-recall-at-3 0.5 > /dev/null

  api:
    name: HTTP contract (optional [api] extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with the optional api extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      # 主 test job 刻意不装 [api]：那组用例在那里 skip，降级路径一直有人验；
      # 这里装上 extra 真跑一遍契约测试。两半都被覆盖，而不是只验一半。
      # 这一半的覆盖率单独度量：主 job 因不装 extra 而看不到它（见 pyproject 的 omit 说明）。
      # 地板 85% 而不是核心的 90%：api/__main__.py 是 uvicorn 的进程装配入口，
      # 单元测试刻意不去真起服务器，那 8 行本来就该是 0%。
      - name: Contract tests
        run: pytest tests/test_api.py -q --cov=app_review_insights.api --cov-config=.coveragerc.api --cov-report=term-missing --cov-fail-under=85

  reliability:
    name: Reliability (crash & fault injection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # 真子进程硬杀 + 同 run_id 续跑的收敛性验证。全部走回放 ⇒ 零模型成本、结果可复现。
      # ARI_COVERAGE 让子进程（恢复路径实际执行的地方）也输出覆盖数据。
      - name: Crash & fault-injection matrix
        env:
          ARI_COVERAGE: "1"
        run: pytest -m reliability -q
      # 恢复路径全在子进程里跑，主作业的 --cov 统计不到；这里合并出来单独看，
      # 免得"新增代码把整体覆盖率拖下去"被误读成"没被测过"。
      - name: Merge subprocess coverage (evidence, not a gate)
        run: |
          coverage combine
          coverage report | tail -n 3
