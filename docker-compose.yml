services:
  web:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: >
        python -c "
        import urllib.request, sqlite3;
        urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3);
        sqlite3.connect('/app/data/runs/runs.sqlite3').close()
        "
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    command: python -m app_review_insights.monitor.worker
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
