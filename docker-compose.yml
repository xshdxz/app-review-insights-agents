services:
  web:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: >
        python -c "
        import urllib.request, sqlite3;
        urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3);
        sqlite3.connect('/app/data/runs/runs.sqlite3').close()
        "
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    command: python -m app_review_insights.monitor.worker
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      # Prometheus 抓取用（仅绑本机）；不需要可删除
      - "127.0.0.1:9100:9100"
    healthcheck:
      # 就绪探针反映调度器状态：worker "活着但卡死" 时会被判定为 unhealthy
      test: >
        python -c "import urllib.request;
        urllib.request.urlopen('http://localhost:${WORKER_HEALTH_PORT:-9100}/readyz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
