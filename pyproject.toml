[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-review-insights"
version = "0.1.0"
description = "Evidence-grounded App Store review analysis and product planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.61,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "openai>=1.99,<2",
  "httpx>=0.28,<1",
  "pandas>=2.3,<3",
  "rapidfuzz>=3.13,<4",
  "langdetect>=1.0.9,<2",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  # 只为结构性校验 ops/ 下的 Prometheus / Grafana 配置而引入（测试期依赖）
  "pyyaml>=6.0,<7",
]
experiments = [
  "langgraph>=0.2,<1",
]
# 可选：HTTP 契约层（fastapi + uvicorn）。不装就没有这一层，核心依赖不受影响；
# Streamlit Cloud 那种单进程演示部署也不需要它。
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
# 可选：三层追踪（run → stage → model call）。没装就是 no-op，核心依赖不受影响。
# CI 刻意不装这个 extra —— 正好让 CI 覆盖"降级路径仍然全绿"那一半。
observability = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." 是仓库根：tests 里有 `from scripts.run_eval import ...`，而裸 pytest 的
# console script 不会把 CWD 放进 sys.path（只有 `python -m pytest` 会）。
# 少了它，CI 上用裸 pytest 会在收集阶段就 ModuleNotFoundError。
pythonpath = ["src", "."]
testpaths = ["tests"]
# 默认排除 reliability 标记的用例（tests/reliability/ 的崩溃矩阵）：它们要起子进程，
# 既慢又不该混进主套件。命令行 -m 会覆盖这里的 -m（实测：22 deselected），
# 因此 CI 用 "pytest -m reliability" 单独跑一个 job。
# 这样裸 pytest 与 CI 主 job 的调用方式保持一致（见 AGENTS.md 已知坑 #12）。
addopts = "-q -m \"not reliability\""
markers = [
  "reliability: 崩溃一致性与故障注入（子进程 + 回放，零模型成本）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
