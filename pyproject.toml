[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-review-insights"
version = "0.1.0"
description = "Evidence-grounded App Store review analysis and product planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.61,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "openai>=1.99,<2",
  "httpx>=0.28,<1",
  "pandas>=2.3,<3",
  "rapidfuzz>=3.13,<4",
  "langdetect>=1.0.9,<2",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
experiments = [
  "langgraph>=0.2,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
